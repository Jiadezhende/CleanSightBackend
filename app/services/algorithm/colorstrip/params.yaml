# 色卡比色判定 — 参数配置（单一真源，代码里不再留默认值副本）
#
# 本算法包自包含：参数、入参上限、默认档全在这个文件里，不进 app/settings.py。
#
# 用法
#   python -m app.services.algorithm.colorstrip.cli 某张图.jpg      # 日志会打出每条判据的实测值
#   python -m app.services.algorithm.colorstrip.cli 某张图.jpg -p warm_light
#   HTTP：POST /algorithm/colorstrip（可选 ?profile=档名），见 docs/api/algorithm.md
#
# 验收工装（不在仓库里，样本太大）：app/services/temp/colorstrip/
#   python stats.py --dir 新样本目录 -p warm_light   # 看新场景下各角色的颜色区间与余量
#   python acceptance.py                            # 门禁恒用 default 档
#
# 结构
#   base      —— 全部判据参数的取值，default 档直接用它
#   profiles  —— 每档只写**要改的那几项**，其余从 base 继承（按两层深合并）
#
# 改参数的规矩
#   1. `default` 是门禁基线，动它等于动基线。改完必须 `python acceptance.py --freeze`
#      重冻结 golden.json，否则门禁会报"基线参数与当前参数不符"并列出差异，不会静默放过。
#   2. 新场景先新开一档（照着 warm_light 抄），别直接改 default——default 的每个数都有
#      8 张样本的实测依据（REPORT.md §2.5、§3），改了就没有依据了。
#   3. 调完新档，跑 `python stats.py -p 新档名 --dir 新样本目录` 看余量，
#      再跑 `python acceptance.py` 确认没把 default 带坏。

# 不传 profile 时用哪一档
default_profile: default

# HTTP 入参上限：base64 **解码后**的原始字节数。超过即 400，不进算法。
# 手机直出照片通常 3–5 MB，留到 12 MB 够用；调大要同时想清楚线程池被占住的时长
# （4.6 MB 的图实测解码 55 ms + 判定 23 ms）。
max_image_bytes: 12000000

base:

  # ---- 分割：从画面里抠出红橙色块 ----
  segment:
    # 分割前把长边缩到这个像素数。固定倍率降采样会在低分辨率图上把色卡两块粘连
    # （case4 实测），归一化之后形态学核尺寸才是分辨率无关量。
    # 调大：小色块更不容易丢，但更慢；调小：更快，但接近 case4 那种低分辨率图会粘连。
    target_long: 1200

    # 红橙色相带。OpenCV 的 H 是 0–179 且红色跨 0 度回绕，所以分成两段：
    # H <= band_low_max  或  H >= band_high_min
    hue_band_low_max: 16
    hue_band_high_min: 172

    # 饱和度下限。白床品、白纸、瓶身、手写字迹全靠这一条排除。
    # 调低：弱显色的浅色块更容易进 mask，但白背景的偏色也跟着进来。
    sat_min: 110

    # 明度区间 [min, max]。**上限给到 255 是有依据的**：800 块是浅橙，光一亮 V 就冲过 200,
    # 旧版本的 200 上限会把整块削掉（case2 实测 V 中位数 222），表面症状是"找不到色卡"。
    # 白背景由 sat_min 排除，不需要 V 上限帮忙。除非新场景实测有高光误检，否则别往下压。
    val_range: [20, 255]

    # 色块面积下限，按**全图面积比**取，与分辨率和拍摄距离解耦。
    # 调大：滤掉更多碎块，但拍得远时真色块也会被滤掉。
    min_area_ratio: 3.0e-5

    # 形态学开/闭运算的核边长与闭运算迭代次数（在归一化后的图上）。
    # 调大：色块更完整但相邻块容易粘连；调小：相反。
    morph_kernel: 5
    morph_close_iters: 2

  # ---- 色卡成对结构：800 与 2000 两块的几何关系 ----
  # 四条判据都是比值，与分辨率、拍摄距离解耦。先定"配对主轴"（两块在哪个方向上分得更开），
  # 再沿主轴量 gap、沿垂直方向量 align，所以竖着拍、横着拍、转 90° 都认。
  card_pair:
    # 垂直于主轴的错位 / 该方向平均尺寸。真色卡对实测 0.00–0.09。
    align_max: 0.5
    # 沿主轴的间隙 / 该方向平均尺寸。真色卡对实测 0.21–0.30。
    gap_max: 1.0
    # 两块面积比 min/max。真色卡对实测 0.93–1.00。
    # 注意：这条不过时先看分割——反光或瓶身弧面把 800 块啃掉一半，也是这条报错（case8 实测 0.69）。
    area_min: 0.70
    # 两块的 L* 差区间。真色卡对实测 15.7–21.6。
    dL_range: [10.0, 25.0]

  # ---- 颜色合法区间：Lab 色相角（度），用于认角色 ----
  # 为什么建在色相上而不是 L* 上：跨 8 张样本，800 块的 L* 漂了 19.6 个单位、色相只漂 5.1°；
  # L* 上 2000 块的上界 52.2 已经越过 800 块的下界 50.6（重叠），色相上两处间隙 12.3°/14.3°。
  # **这些窗口只用来认"谁是 800、谁是 2000"，不参与合格与否的判定，也不是防伪手段**
  # （REPORT.md §6.1：照着真色卡取色的伪造照样放行）。
  #
  # 换光源要调的就是这一组：钨丝灯/荧光灯的白平衡偏移会整体推动色相角。
  # 调法：拿新光源下的样本跑 `python stats.py --dir 新目录`，看实测区间推了多少，
  # 照着推同样的量，两端各留 5–6° 余量。
  color_window:
    hue_2000: [36.0, 56.0]      # 实测 42.5–48.5
    hue_800:  [56.0, 80.0]      # 实测 62.8–67.9
    # 已显色试纸垫的色相上界。**当前只被 stats.py 用来出区间表，不是判据**——
    # 弱显色的试纸色相会合理地靠近 800 块，设成硬门会误拒最该看的那类样本。
    strip_hue_max: 36.0         # 实测 24.0–30.3

  # ---- 上传规范 ----
  spec:
    # 一张图里待测试纸的条数。不等于这个数一律拒判：
    # 少了多半是试纸未显色（浅白色压根进不了红橙 mask），多了是混进了非试纸的红橙物。
    expected_strips: 1

profiles:

  # 门禁基线。每个数都有 8 张样本的实测依据，见 REPORT.md §2.5 与 §3。
  default: {}

  # 示例档：暖光（钨丝灯）下色相整体偏红，两个窗口一起往小推 8°。
  # 这一档**没有样本标定过**，只是给你一个照抄的模板，别直接拿去用。
  warm_light:
    color_window:
      hue_2000: [28.0, 48.0]
      hue_800:  [48.0, 72.0]
      strip_hue_max: 28.0

  # 示例档：远距离/低分辨率拍摄，色块像素少。
  # 同样没有样本标定过。
  low_res:
    segment:
      target_long: 1600
      min_area_ratio: 1.0e-5
      morph_kernel: 3
