# 部署单一事实源：build.sh 与 install.sh 都 source 本文件。
# 升级版本只改这里；改完到构建机重跑 ./build.sh 即可。
# 纯 bash 变量，勿写命令。

# ===== 核心 Python 重包（cu128 闭包；torch 版本的唯一来源）=====
# build.sh 把这两个包的全闭包（~6GB，含 nvidia CUDA）下进 wheelhouse/。
# requirements.txt 不再列 torch/torchvision，避免双份版本。
TORCH_INDEX_URL="https://mirror.nju.edu.cn/pytorch/whl/cu128"
TORCH_PKGS="torch==2.8.0 torchvision==0.23.0"

# 其余 Python 依赖在线拉取用的镜像源
PYPI_INDEX_URL="https://pypi.tuna.tsinghua.edu.cn/simple"

# ===== ffmpeg 静态包（BtbN，钉版）=====
# 一整条 URL；资产名由 basename 取，部署后路径见 docs/HLS_TIMELINE_PITFALL.md。
# SHA256 留空：build.sh 首次下载后会算好并打印，回填到这里即生效强制校验。
# 部署目标固定为项目内 .ffmpeg/（install.sh 内部约定，与 mediamtx 同为项目内二进制；
# 免 sudo、无需配置，后端经 app/settings._resolve_ffmpeg_path 自动探测）。
FFMPEG_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-06-01-15-02/ffmpeg-n7.1.4-7-gadcf20da26-linux64-gpl-7.1.tar.xz"
FFMPEG_SHA256="afde55344990650c117fbb7cb36b38d2ab6790b06beb06a9c43a9300c9ce277a"

# ===== ffmpeg（Windows 开发机；仅原生 install.ps1 使用，Linux 脚本忽略本项）=====
# 用 BtbN `latest` tag 的非滚动稳定 URL（规避 autobuild 日期 tag 过期），并钉在 7.1 分支
# ——与 Linux 版同样满足 HLS fmp4 行为要求（见 docs/HLS_TIMELINE_PITFALL.md）。
# 开发便利向，故不钉 SHA：install.ps1 在线下载解压到项目内 .ffmpeg\；失败自动回退 PATH。
FFMPEG_WIN_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-7.1.zip"

# ===== mediamtx 二进制（钉版）=====
# 只解出二进制进 MEDIAMTX_DIR，保留同目录随 git 走的 mediamtx.yml / LICENSE。
MEDIAMTX_URL="https://github.com/bluenviron/mediamtx/releases/download/v1.15.5/mediamtx_v1.15.5_linux_amd64.tar.gz"
MEDIAMTX_SHA256="158ebff59739d723a5bb60a7c6c42d908d378609f6237a94e583edd5456f7322"
MEDIAMTX_DIR="mediamtx"

# ===== 安装期物料来源（Linux install.sh 用）=====
# 统一规则：留空 = 用本地物料（跳过下载）；填地址 = install 时从该 URL 拉（离线源或在线皆可）。无多源 fallback。
# 与上面 build.sh 用的 GitHub 钉版 URL（FFMPEG_URL/MEDIAMTX_URL）彼此独立：那些是“构建物料”的源，下面是“安装取料”的源。
# 三者均为「目录/基址 URL」；资产文件名复用上面 *_URL 的 basename，无需重复填。可用环境变量临时覆盖、无需改本文件。
#
# torch 闭包：直接做 pip --find-links（接受本地目录或 HTTP 目录页）
#   空 → 用本地 wheelhouse/        填 → 例 http://<源机IP>:8080/wheelhouse/
TORCH_WHEEL_URL="${TORCH_WHEEL_URL:-}"

# ffmpeg 静态包目录基址
#   空 → 用本地 vendor/ffmpeg/     填 → 例 http://<源机IP>:8080/vendor/ffmpeg/
FFMPEG_SRC_URL="${FFMPEG_SRC_URL:-}"

# mediamtx 包目录基址
#   空 → 用本地 vendor/mediamtx/   填 → 例 http://<源机IP>:8080/vendor/mediamtx/
MEDIAMTX_SRC_URL="${MEDIAMTX_SRC_URL:-}"
