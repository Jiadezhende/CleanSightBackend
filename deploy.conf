# 部署单一事实源：build.sh 与 install.sh 都 source 本文件。
# 只放「升级版本时真正要改的东西」：源机基址 + 钉板资源 URL/SHA + 依赖别名。
# 在线镜像（pytorch/清华源）、仓库内安装路径（.ffmpeg/、mediamtx/）已写死在各脚本里，不在此。
# 纯 bash 变量，勿写命令。

# ===== 源机物料基址（离线分发）=====
# 空 = 用本地 wheelhouse/ + vendor/（构建机本机装，或已 rsync 过物料）。
# 填 = install 时从此 HTTP 服务流式拉，子路径由脚本派生：
#        torch    → ${BASE_URL}/wheelhouse/
#        ffmpeg   → ${BASE_URL}/vendor/ffmpeg/<固定名>
#        mediamtx → ${BASE_URL}/vendor/mediamtx/<固定名>
# 一处明确来源，无多源 fallback。运行时覆盖、无需改本文件：
#   BASE_URL=http://<源机IP>:8080 ./install.sh
BASE_URL="${BASE_URL:-}"

# ===== 钉板：ffmpeg =====
# 升级：改 URL；Linux 同时清空 SHA，构建机 ./build.sh 后把打印值回填以启用强校验。
# 必须钉版：ffmpeg 4.x/8.x 对 -hls_fmp4_init_filename 解析差异巨大，见 docs/HLS_TIMELINE_PITFALL.md。
# Linux（生产）：强校验 SHA；落地项目内 .ffmpeg/（脚本约定，后端 _resolve_ffmpeg_path 自动探测）。
FFMPEG_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-06-01-15-02/ffmpeg-n7.1.4-7-gadcf20da26-linux64-gpl-7.1.tar.xz"
FFMPEG_SHA256="afde55344990650c117fbb7cb36b38d2ab6790b06beb06a9c43a9300c9ce277a"
# Windows（开发机）：BtbN latest 滚动版，开发便利向、不钉 SHA。
FFMPEG_WIN_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-7.1.zip"

# ===== 钉板：mediamtx =====
# 只解出二进制；同目录随 git 走的 mediamtx.yml / LICENSE 保留不覆盖。
# Linux（生产）：强校验 SHA。
MEDIAMTX_URL="https://github.com/bluenviron/mediamtx/releases/download/v1.15.5/mediamtx_v1.15.5_linux_amd64.tar.gz"
MEDIAMTX_SHA256="158ebff59739d723a5bb60a7c6c42d908d378609f6237a94e583edd5456f7322"
# Windows（开发机）：同版本 zip，开发便利向、不钉 SHA。
MEDIAMTX_WIN_URL="https://github.com/bluenviron/mediamtx/releases/download/v1.15.5/mediamtx_v1.15.5_windows_amd64.zip"

# ===== Python 核心重包别名（build.sh 下载 / install.sh + install.ps1 安装共用）=====
# requirements.txt 不再列 torch/torchvision，避免双份版本。
TORCH_PKGS="torch==2.8.0 torchvision==0.23.0"
