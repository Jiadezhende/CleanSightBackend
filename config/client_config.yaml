# 客户端队列配置
# 用于管理每个客户端的帧缓冲队列
# 注意：队列长度（rt_maxlen, ca_maxlen, ca_segment_len）和推理帧率（inference_fps）
#       统一从 inference_config.yaml 中读取

frame:
  # 帧处理配置
  resize_width: 640          # 统一resize宽度
  resize_height: 480         # 统一resize高度

state:
  # 业务状态配置
  initial_stage: "LEAK"      # 初始检测阶段
  heartbeat_timeout: 30      # 心跳超时（秒）
