# 客户端队列配置
# 用于管理每个客户端的帧缓冲队列
# 注意：队列长度（ca_maxlen, ca_segment_len）和推理帧率（inference_fps）
#       统一从 inference_config.yaml 中读取

frame:
  # 帧处理配置
  resize_width: 640          # 统一resize宽度
  resize_height: 480         # 统一resize高度

# 注：初始 stage 不在此配置——未分配任务的客户端默认 MOCK 透传（ClientQueues 硬编码兜底）。
#     心跳超时等状态参数走 StateConfig 默认值，需要时再在此添加 state: 段。
