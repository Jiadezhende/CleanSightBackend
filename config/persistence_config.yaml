# 持久化服务配置
# 包含存储清理、告警持久化相关的业务参数

# 存储配置
# 注意：存储根目录 base_dir 已上移到 settings（env: CLEANSIGHT_STORAGE_DIR，默认 ./database），
#       为全仓单一真源；此处仅保留持久化自有的写库开关与清理策略。
storage:
  enable_cleanup: true            # 是否启用自动清理（设为 true 以启用 TTL 清理）
  cleanup_days: 15                 # 保留天数：status=completed 且超过此天数的任务目录将被删除
  cleanup_interval_seconds: 3600  # 清理扫描间隔（秒），默认每小时一次

# 告警持久化配置
alarm:
  workers: 1                      # 告警Worker数量
  queue_size: 200                 # 告警队列最大长度

  # 注意：告警上报重试由 GuardedExecutor 统一处理（persistence策略：3次，指数退避）
  # 注意：告警降频由 ClientQueues.try_pass_alarm_gate 统一控制（5s 固定冷却窗口）
