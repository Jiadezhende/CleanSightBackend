# 持久化服务配置
# 包含存储、HLS视频持久化、告警持久化相关的业务参数

# 存储配置
storage:
  base_dir: ./database            # 存储根目录（相对于项目根目录）
  enable_db_write: false          # 是否写入数据库file_path表
  # enable_cleanup: false         # [未使用] 是否启用自动清理 - 该配置已加载但代码中未实际使用
  # cleanup_days: 7               # [未使用] 保留天数 - 该配置已加载但代码中未实际使用

# HLS持久化配置
hls:
  workers: 2                      # HLS Worker数量
  queue_size: 100                 # HLS队列最大长度
  segment_duration: 10            # 视频段时长（秒）

  # 注意：帧率参数（raw_fps, processed_fps）从 inference_config.yaml 中读取

# 告警持久化配置
alarm:
  workers: 1                      # 告警Worker数量
  queue_size: 200                 # 告警队列最大长度
  batch_interval: 30              # 批量上报间隔（秒）
  cooldown_seconds: 60            # 告警冷却期（秒）
  retry_times: 3                  # 上报重试次数
  retry_backoff: 1.0              # 重试退避时间（秒）
