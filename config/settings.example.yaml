# 每个部署目录只使用一份 config/runtime.yaml。复制此模板后填写本机配置。
# 进程环境变量 CLEANSIGHT_* 优先于本文件；启动命令不选择环境角色。
# 字段使用 Settings 的小写名称。密码、token 等建议始终使用引号。
# 推理规则等服务参数继续由对应 config/*.yaml 管理。

# ==================== 数据库配置（必需）====================
db_host: "your_db_host"
db_port: 5432
db_name: "your_db_name"
db_user: "your_db_user"
db_password: "your_db_password"

# ==================== 外部接口URL（必需）====================
# 告警上报接口URL
alarm_report_url: http://your-server/api/alarm_report

# ==================== 服务端口 ====================
# 环境变量优先于本文件。启动入口将这些端口同步给后端、网关与 MediaMTX。
port: 8000
mediamtx_proxy_port: 8004
mediamtx_internal_port: 18004
mediamtx_rtp_port: 8002
mediamtx_rtcp_port: 8003
# host: 0.0.0.0
# MediaMTX 空 binary 表示外部管理、仅运行代理
# mediamtx_bin: auto
# mediamtx_config: config/mediamtx.yml
# 同机多实例使用不同项目目录、数据库与端口。
# 对外 HTTP / RTSP 若经 NAT，确认平台映射，RTSP 对外与容器内端口需保持一致。

# ==================== 日志配置（可选）====================
# 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
# log_level: INFO

# ==================== 应用配置（可选）====================
# 调试模式（启用详细装饰器日志等）
debug: false
# 严格模式（按实际用途选择，缺失配置需要阻止启动时开启）
# 开启后，缺少必需配置会导致启动失败
strict: true

# ==================== 模型与工具（可选）====================
# 模型文件夹基础路径（具体文件名由 inference_config.yaml 决定）
# 默认值: ./app/data
model_path: "./app/data"
# 推理子进程独占的卡序号（默认 0）。共享卡的机器要显式锁卡，避免和邻居抢算力。
# cuda_device: "0"
# FFmpeg 二进制路径（默认留空 = 锁定项目内钉版 .ffmpeg/bin/ffmpeg，不回退 PATH，缺料即报错）
# 仅当需指向其它 ffmpeg（如 Mac 开发机用 homebrew）时才显式设置。
# ffmpeg_path: ""

# ==================== 拉流与断流检测（可选）====================
# 拉流 socket 读超时（秒），传给 decoder ffmpeg 的 -timeout。默认 2.5
# 断流判死延迟 = 2×本值。上界：2×本值 < health_monitor 的 cleanup_timeout
# （config/health_monitor_config.yaml，默认 20s）。依据见 docs/update/20260920_RTSP_READ_TIMEOUT.md
# rtsp_read_timeout_s: 2.5

# ==================== HTTP / RTSP Gateway（可选）====================
# HTTP / RTSP 访问检查开关，代理与 MediaMTX 仍由 lifespan 管理
# gateway_enabled: true
# IP 白名单（逗号分隔，空=不限制；IP 固定后在此填写）
# gateway_allowed_ips: 10.0.0.1,10.0.0.2
# 普通接口速率限制（每窗口最大请求数 / 窗口秒数）
# HTTP 请求数与 RTSP 连接数分别计数
# rtsp_rate_limit: 30
# gateway_rate_limit: 60
# gateway_rate_window: 60
# 速率超限升级封禁：窗口内持续超限违规达到阈值后封禁该 IP（0=不封禁）
# gateway_rate_ban_threshold: 5
# gateway_rate_ban_window: 60
# 宽松路径：高频轮询接口，独立高配额 bucket，不计入封禁升级和扫描检测
# 前缀匹配（逗号分隔）。/media 不在此列——它走下方 BYPASS_PREFIXES（更高一档，
# 完全跳过限流），因为段请求自带 HMAC token 鉴权且频次远超 600/60s。
# gateway_relaxed_prefixes: /health,/task/message,/task/live,/task/history,/traceback,/admin/,/metrics,/ui-f3m8
# gateway_relaxed_rate_limit: 600
# 绕过路径：完全跳过限流与反扫描，仅保留 IP 白名单/封禁检查。
# 只给自带强鉴权的路由（/media/* 的 token 验不过即 403，无可枚举面）。
# gateway_bypass_prefixes: /media
# 反扫描：窗口内 404/405 次数达到阈值后封禁该 IP
# gateway_scan_threshold: 10
# gateway_scan_window: 300
# gateway_ban_duration: 3600

# ==================== 并发容量（可选）====================
# 启动内存自检：按规划路数估算最坏帧缓存 + 进程基线，超过 MemAvailable 拒绝启动（仅 Linux）。
# 只做容量规划，不限制实际路数。依据见 docs/update/20261013_MEMORY_BUDGET.md
# capacity_planned_streams: 15
# memory_check_enforce: true      # false = 超预算只告警（内存紧的测试机用）
# ca_maxlen_seconds: 20           # ca_raw / ca_processed 缓存秒数（≥ 1.2 倍 HLS 段长）
# 渲染子进程数；0 = 在可视化线程内渲染。依据见 docs/update/20261013_VIZ_RENDER_PROCESSES.md
# viz_processes: 2
