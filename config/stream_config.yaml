# 流处理服务配置
# 用于RTMP/RTSP流的拉取、解码、健康监控

decoder:
  # FFmpeg解码器配置
  default_width: 640
  default_height: 480
  default_fps: 30
  pix_fmt: "bgr24"
  chunk_read_size: 32768     # 每次读取字节数

  # 背压控制
  backpressure_ratio: 0.90   # 队列达到90%时丢帧

health_monitor:
  # 健康监控配置
  check_interval: 5.0        # 检查间隔（秒）
  heartbeat_timeout: 10.0    # 心跳超时（秒）
  restart_delay: 3.0         # 重启延迟（秒）
  max_restart_attempts: 5    # 最大重启次数
  restart_window: 60.0       # 重启窗口（秒）

cleanup:
  # 清理服务配置
  check_interval: 30.0       # 检查间隔（秒）
  orphan_timeout: 90.0      # 孤儿流超时（秒，5分钟）
