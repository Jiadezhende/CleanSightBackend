# 流处理服务配置
# 用于RTMP/RTSP流的拉取、解码

decoder:
  # FFmpeg解码器配置
  default_width: 640
  default_height: 480
  # default_fps 不在此设置：解码 CFR = 生产者源，单一真源 settings.raw_fps（env CLEANSIGHT_RAW_FPS）。
  # 在此写死会重造第二个独立 fps 源、与 settings 漂移。
  pix_fmt: "bgr24"
  chunk_read_size: 32768     # 每次读取字节数

  # 背压控制
  backpressure_ratio: 0.90   # 队列达到90%时丢帧

# 注意：health_monitor 配置已迁移到 config/health_monitor_config.yaml
