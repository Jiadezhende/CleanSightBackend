# 推理服务阶段配置文件（Detector + TemporalAnalyzer 架构）
#
# 架构说明：
# 1. 每个检测任务拆分为 Detector（无状态推理）+ TemporalAnalyzer（有状态时序分析）
# 2. Detector 多 Client 共享同一实例，TemporalAnalyzer 每 Client 独立实例化
# 3. 可视化使用固定渲染器（FixedVisualizer），Detector 只需提供 VisualizationData
# 4. YAML 中声明 class/params（Detector）和 analyzer_class/analyzer_params（TemporalAnalyzer）
#
# 开发者只需：
# 1. 创建 Detector 子类（实现 infer + prepare_visualization_data）
# 2. 创建 TemporalAnalyzer 子类（实现 analyze_temporal，可选 override finalize）
# 3. 在 YAML 中声明两者的 class 和 params

stages:
  # ==================== LEAK 阶段（泄漏检测） ====================
  LEAK:
    # 模型列表（按顺序执行）
    # 每个 Task 自带时序分析、可视化、告警逻辑
    models:
      - name: bubble
        class: app.services.inference.workflows.bubble.BubbleDetector
        analyzer_class: app.services.inference.workflows.bubble.BubbleAnalyzer
        judge_class: app.services.inference.workflows.bubble.BubbleJudge
        params:
          model_path: ${CLEANSIGHT_MODEL_PATH:./app/data}/bubble-best.pt
          conf_threshold: 0.1
          iou_threshold: 0.45
          enabled: true
        analyzer_params:
          window_seconds: 3.0          # 滑动窗口时长（秒）
        judge_params:
          birth_rate_threshold: 0.5    # 新气泡出现率阈值（新气泡数/窗口帧数）

      - name: bending
        realtime: false              # 结算告警，不纳入 signals_10s 滑动窗口
        class: app.services.inference.workflows.bending.BendingDetector
        analyzer_class: app.services.inference.workflows.bending.BendingAnalyzer
        judge_class: app.services.inference.workflows.bending.BendingJudge
        params:
          model_path: ${CLEANSIGHT_MODEL_PATH:./app/data}/bend-best.pt
          conf_threshold: 0.1
          iou_threshold: 0.45
          enabled: true
        analyzer_params:
          debounce_frames: 5           # 状态切换去抖帧数
        judge_params:
          required_bend_actions: 4     # 合格所需最少弯曲次数

    # 以下配置在新架构中已不需要（保留用于向后兼容）
    # temporal_analyzer:
    #   class: app.services.inference.components.DefaultTemporalAnalyzer
    #   config: ...
    # visualizer:
    #   class: app.services.inference.components.DefaultVisualizer
    # alarm_triggers: ...

  # ==================== CLEAN 阶段（清洁检测，暂无模型，纯透传） ====================
  CLEAN:
    models:
      - name: mock_detection
        class: app.services.inference.workflows.mock.MockDetector
        params:
          brightness_threshold: 0.0   # 永不触发检测，纯透传
          enabled: true
        analyzer_class: app.services.inference.workflows.mock.MockAnalyzer
        judge_class: app.services.inference.workflows.mock.MockJudge
        judge_params:
          consecutive_trigger: 999    # 实际上永不满足，禁止告警

  # ==================== MOCK 阶段（未知 current_step 的 fallback，纯透传） ====================
  MOCK:
    models:
      - name: mock_detection
        class: app.services.inference.workflows.mock.MockDetector
        params:
          brightness_threshold: 0.0   # 永不触发检测，纯透传
          enabled: true
        analyzer_class: app.services.inference.workflows.mock.MockAnalyzer
        judge_class: app.services.inference.workflows.mock.MockJudge
        judge_params:
          consecutive_trigger: 999    # 实际上永不满足，禁止告警

# ==================== 全局配置（所有模块共享） ====================
global:
  # 视频处理参数（所有模块共享）
  raw_fps: 30                     # 原始视频帧率（persistence, stream模块会读取）
  inference_fps: 20               # 推理/输出帧率（persistence, client模块会读取）

  # 批处理参数
  batch_size: 4                   # 推理批量大小
  inference_decimation: 2         # 推理降帧率（1=不降帧，2=每2帧推理1次）

  # 队列参数（client模块会读取）
  ca_maxlen: 2700                 # CA队列最大长度（帧数，约90秒@30fps）
  ca_segment_len: 300             # HLS段长度（帧数，约10秒@30fps）

  # 可视化参数（新架构）
  visualization:
    enabled: true                 # 是否启用可视化
    use_fixed_visualizer: false   # 是否使用新的固定渲染器（设为 true 启用）

  # 注意：
  # - persistence和client模块会直接读取这些参数，保证全局一致性
  # - 修改这些参数会影响所有相关模块
