# 推理服务阶段配置文件（流处理框架：流源 Detector + 流算子 Operator）
#
# 架构说明：
# 1. detectors[]：流源（分组粒度），无状态多 Client 共享；name = 该 detector 产出的流名
# 2. rules[]：流算子（规则粒度），每 Client 独立；subscribes 订阅输入流名，
#    class = 合并 analyze(推进状态)+judge(出告警) 的 Operator，params.window_seconds = 感受野
# 3. offline：离线段（stage 粒度）按 YAML 路由到 OfflineSegmenter，空块表示不启用
# 4. 可视化使用固定渲染器（FixedVisualizer），Detector 只需提供 VisualizationData
#
# 开发者只需：
# 1. 创建 Detector 子类（实现 infer + prepare_visualization_data），detectors[] 加一行
# 2. 创建 Operator 子类（实现 analyze + judge，可选 override finalize），rules[] 加一行并声明 subscribes

stages:
  # 主键 = step_id（task.current_step，字符串）；alias = 可读名（写告警 step_name + 可视化叠字）
  #
  # 流处理框架，每个 stage 三段：
  #   detectors[] —— 流源（分组粒度）：name = 该 detector 产出的流名（slide_window key）
  #   rules[]     —— 流算子（规则粒度）：subscribes 订阅输入流名，class = 合并 analyze+judge 的 Operator
  #   offline     —— 离线段（stage 粒度）：非空即启用，class 指定具体离线模型
  #
  # ==================== step "1" / LEAK 阶段（泄漏检测） ====================
  "1":
    alias: LEAK
    detectors:
      - name: bubble
        class: app.services.inference.workflows.bubble.BubbleDetector
        params:
          model_path: ${CLEANSIGHT_MODEL_PATH:./app/data}/bubble-best.pt
          conf_threshold: 0.1
          iou_threshold: 0.45
          enabled: true
      - name: bending
        class: app.services.inference.workflows.bending.BendingDetector
        params:
          model_path: ${CLEANSIGHT_MODEL_PATH:./app/data}/bend-best.pt
          conf_threshold: 0.1
          iou_threshold: 0.45
          enabled: true
    rules:
      - name: bubble_leak
        subscribes: [bubble]
        realtime: true               # 实时信号，纳入 signals_10s
        class: app.services.inference.workflows.bubble.BubbleOperator
        params:
          window_seconds: 3.0          # 感受野（秒）= 出生率滑窗时长
          birth_rate_threshold: 0.5    # 新气泡出现率阈值（新气泡数/窗口帧数）
      - name: bending_check
        subscribes: [bending]
        realtime: false              # 结算告警，不纳入 signals_10s
        class: app.services.inference.workflows.bending.BendingOperator
        params:
          debounce_frames: 5           # 状态切换去抖帧数
          required_bend_actions: 4     # 合格所需最少弯曲次数
    offline: {}                      # 预留，本次未实现

  # ==================== step "2" / CLEAN 阶段（清洁检测：按尺寸分两组，仅检测画框） ====================
  # rules 为空 → 不建 Operator/Actor，仅由 detector 提供检测框可视化。
  "2":
    alias: CLEAN
    detectors:
      - name: clean_large       # 大目标组：手 / scope_control_body / scope_mid_section
        class: app.services.inference.workflows.clean.CleanLargeDetector
        params:
          model_path: ${CLEANSIGHT_MODEL_PATH:./app/data}/clean-large-best.pt
          conf_threshold: 0.25
          iou_threshold: 0.45
          enabled: true
      - name: clean_small       # 小目标组：syringe / air_gun / scope_distal_end
        class: app.services.inference.workflows.clean.CleanSmallDetector
        params:
          model_path: ${CLEANSIGHT_MODEL_PATH:./app/data}/clean-small-best.pt
          conf_threshold: 0.25
          iou_threshold: 0.45
          enabled: true
    rules:
      - name: clean_monitor
        subscribes: [clean_large, clean_small]
        realtime: true               # 实时信号，纳入 signals_10s
        class: app.services.inference.workflows.clean.CleanOperator
        params:
          window_seconds: 10.0
          # 模型契约帧率：入模前把 ~inference_fps 的窗口按 ts 重采样到此帧率再喂模型。
          # 必须等于训练 fps（gru-final.pt 训练于 7.5fps）；配错不崩、静默降级（train/serve skew）。
          model_input_fps: 7.5
          model_path: ${CLEANSIGHT_MODEL_PATH:./app/data}/gru-final.pt
          actions:
            0: idle
            1: air_injection
            2: flush
            3: long_brush_insert
            4: long_brush_withdraw
          objects:
            0: hand
            1: scope_control_body
            2: scope_mid_section
            3: scope_distal_end
            4: syringe
            5: air_gun
            6: short_brush
            7: brush_tip_out
    # CLEAN 离线模型按 YAML 路由，生产/开发需要启用时把 offline 从 {} 改为类似：
    # offline:
    #   name: clean_offline
    #   subscribes: [clean_large, clean_small]
    #   class: app.services.inference.offline.segmenters.clean.CleanMSTCNBiLSTMSegmenter
    #   # 可选模型:
    #   # class: app.services.inference.offline.segmenters.clean.CleanASFormerSegmenter
    #   # class: app.services.inference.offline.segmenters.clean.CleanBiGRUSegmenter
    #   params:
    #     model_path: ${CLEANSIGHT_MODEL_PATH:./app/data}/clean-offline-mstcn-bilstm.pt
    offline: {}                      # 生产默认不启用；MOCK stage 提供默认端到端兜底

  # ==================== MOCK 阶段（未知 current_step 的 fallback + taskless 默认，纯透传） ====================
  MOCK:
    alias: MOCK
    detectors:
      - name: mock
        class: app.services.inference.workflows.mock.MockDetector
        params:
          brightness_threshold: 0.0   # 永不触发检测，纯透传
          enabled: true
    rules:
      - name: mock_passthrough
        subscribes: [mock]
        realtime: true
        class: app.services.inference.workflows.mock.MockOperator
        params:
          consecutive_trigger: 999    # 实际上永不满足，禁止告警
    # 离线段：本次唯一启用的 offline 配置，作「能端到端跑的配置化路由样例」。
    # 离线是独立进程手动跑（python -m app.services.inference.offline.cli run --step-id -1），
    # 不会被在线链路自动执行；未配数字 step_id(如 -1) 经 resolve_stage 回退到本 MOCK stage。
    # 生产 stage 1/2 的 offline 保持 {} 不启用。
    offline:                           # 非空即启用（无需 enabled 开关）；生产 stage 保持 {} 禁用
      name: mock_offline
      subscribes: [mock]
      class: app.services.inference.offline.segmenters.mock.BrushRulesSegmenter
      params:
        label: mock_action
        min_frames: 1

# ==================== 推理自有参数 ====================
# 注意：跨模块共享参数（raw_fps / inference_fps / ca_maxlen / ca_segment_len）已上浮到
#       app/settings.py 作单一真源，此处不再保留——避免其它模块反向钻进推理配置读共享参数。
batch_size: 4                     # 推理批量大小（推理模块自有）
