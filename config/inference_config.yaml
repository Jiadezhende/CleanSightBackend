# 推理服务阶段配置文件（流处理框架：流源 Detector + 流算子 Operator）
#
# 架构说明：
# 1. detectors[]：流源（分组粒度），无状态多 Client 共享；name = 该 detector 产出的流名
# 2. rules[]：流算子（规则粒度），每 Client 独立；subscribes 订阅输入流名，
#    class = 合并 analyze(推进状态)+judge(出告警) 的 Operator，params.window_seconds = 感受野
# 3. offline：离线段（stage 粒度）只含 class + params；class 指定 OfflineSegmenter（producer = 类名），
#    缺省/空块表示该 stage 不可跑
# 4. 可视化使用固定渲染器（FixedVisualizer），Detector 只需提供 VisualizationData
#
# 开发者只需：
# 1. 创建 Detector 子类（detection/impl/<业务>.py，实现 infer + prepare_visualization_data），detectors[] 加一行
# 2. 创建 Operator 子类（temporal/impl/<业务>.py，实现 analyze + judge，可选 override finalize），rules[] 加一行并声明 subscribes
#    （离线 Segmenter 一个策略一个包，放 offline/segmentation/impl/<业务>_<模型>/；class 用全限定路径）

stages:
  # 主键 = step_id（task.current_step，字符串）；alias = 可读名（写告警 step_name + 可视化叠字）
  #
  # 流处理框架，每个 stage 三段：
  #   detectors[] —— 流源（分组粒度）：name = 该 detector 产出的流名（slide_window key）
  #   rules[]     —— 流算子（规则粒度）：subscribes 订阅输入流名，class = 合并 analyze+judge 的 Operator
  #   offline     —— 离线段（stage 粒度）：{class, params}，非空即启用；缺省/空块 = 不可跑
  #
  # ==================== step "1" / LEAK 阶段（泄漏检测） ====================
  "1":
    alias: LEAK
    detectors:
      - name: bubble
        class: app.services.inference.online.detection.impl.bubble.BubbleDetector
        params:
          model_path: ${CLEANSIGHT_MODEL_PATH:./app/data}/bubble-best.pt
          conf_threshold: 0.25
          iou_threshold: 0.45
          enabled: true
      - name: bending
        class: app.services.inference.online.detection.impl.bending.BendingDetector
        params:
          model_path: ${CLEANSIGHT_MODEL_PATH:./app/data}/bend-best.pt
          conf_threshold: 0.1
          iou_threshold: 0.45
          enabled: true
    rules:
      - name: bubble_leak
        subscribes: [bubble]
        realtime: true               # 实时信号，纳入 signals_10s
        class: app.services.inference.online.temporal.impl.bubble.BubbleOperator
        params:
          window_seconds: 3.0          # 感受野（秒）= 出生率滑窗时长
          birth_rate_threshold: 0.5    # 新气泡出现率阈值（新气泡数/窗口帧数）
      - name: bending_check
        subscribes: [bending]
        realtime: false              # 结算告警，不纳入 signals_10s
        class: app.services.inference.online.temporal.impl.bending.BendingOperator
        params:
          debounce_frames: 5           # 状态切换去抖帧数
          required_bend_actions: 4     # 合格所需最少弯曲次数
    offline: {}                      # 无离线模型

  # ==================== step "2" / CLEAN 阶段（清洁检测：按尺寸分两组，仅检测画框） ====================
  # rules 为空 → 不建 Operator/Actor，仅由 detector 提供检测框可视化。
  "2":
    alias: CLEAN
    detectors:
      - name: clean_large       # 大目标组：手 / scope_control_body / scope_mid_section
        class: app.services.inference.online.detection.impl.clean.CleanLargeDetector
        params:
          model_path: ${CLEANSIGHT_MODEL_PATH:./app/data}/clean-large-best.pt
          conf_threshold: 0.3
          iou_threshold: 0.45
          enabled: true
      - name: clean_small       # 小目标组：syringe / air_gun / scope_distal_end
        class: app.services.inference.online.detection.impl.clean.CleanSmallDetector
        params:
          model_path: ${CLEANSIGHT_MODEL_PATH:./app/data}/clean-small-best.pt
          conf_threshold: 0.25
          iou_threshold: 0.45
          enabled: true
    rules:
      - name: clean_monitor
        subscribes: [clean_large, clean_small]
        realtime: true               # 实时信号，纳入 signals_10s
        class: app.services.inference.online.temporal.impl.clean.CleanOperator
        params:
          window_seconds: 10.0
          # 模型契约帧率：入模前把 ~inference_fps 的窗口按 ts 重采样到此帧率再喂模型。
          # 必须等于训练 fps（gru-final.pt 训练于 7.5fps）；配错不崩、静默降级（train/serve skew）。
          model_input_fps: 7.5
          model_path: ${CLEANSIGHT_MODEL_PATH:./app/data}/gru-final.pt
          actions:
            0: idle
            1: air_injection
            2: flush
            3: long_brush_insert
            4: long_brush_withdraw
          objects:
            0: hand
            1: scope_control_body
            2: scope_mid_section
            3: scope_distal_end
            4: syringe
            5: air_gun
            6: short_brush
            7: brush_tip_out
    offline:                         # 离线段（stage 粒度）：class 指定离线模型，缺省/空块 = 不可跑
      class: app.services.inference.offline.segmentation.impl.clean_mstcn2_role_embed.segmenter.CleanMSTCN2RoleEmbedSegmenter
      # 换 class 须同时换 params（物料与特征 recipe 一一对应）。历史策略各自一个包，可直接粘贴的 YAML 片段写在
      # impl/<包>/segmenter.py 的 docstring：clean_mstcn_bilstm / clean_asformer / clean_bigru / clean_gru_nodep（上一版默认）/
      # clean_mstcn2_bundle。物料核对：python -m app.services.inference.offline.cli materials
      params:
        # 物料一个模型一个目录，目录内文件名由策略类写死
        model_dir: ${CLEANSIGHT_MODEL_PATH:./app/data}/clean-offline-mstcn2-role-embed          # temporal.pt + hand_state.npz
        backbone_dir: ${CLEANSIGHT_MODEL_PATH:./app/data}/backbones/dinov2_vits14     # dinov2 hub 代码 + 权重
        device: cuda                 # DINOv2 所用设备；卡号随在线推理（settings.cuda_device）。无 GPU 的机器配 cpu
        max_crops_per_s: 150         # DINOv2 限速（次裁剪/秒），与在线 YOLO 共卡时让出算力；null = 不限速
        max_duration_s: 900          # 只推理首帧起前 15 分钟，超出截断（限住超长 step 的资源占用）；null = 不截断
    compliance:                      # 离线规则层：离线分割 completed 后核对，违规疑似落 run 的 alarms.jsonl；缺省 / rules 为空 = 不核对
      # 只读 label_probs.npz + detections.jsonl；改规则后 `python -m app.services.inference.offline.cli check --dry-run` 重跑即可。
      # 数值均为初值，待在已标注的 run 上标定。规则依据见 docs/update/20261018_OFFLINE_COMPLIANCE_RULES.md
      evidence:
        smooth_s: 1.0                # 组概率居中滑动平均窗
        p_floor: 0.3                 # 平滑后组概率低于它的帧不计证据积分（挡住长 idle 段上的底噪）
        visible_classes: [scope_control_body, scope_mid_section]   # ±visible_window_s 内任一检出即视为该帧可见
        visible_window_s: 1.0
        gap_s: 2.0                   # 逐帧时长上限，detections 断档不计入时长
        episodes:                    # 实例切分两套参数：strict 偏少计 / 偏短，lenient 反之；两套都判违规才报
          strict:  {p_on: 0.6, p_off: 0.4, merge_gap_s: 1.5, min_len_s: 1.5}
          lenient: {p_on: 0.4, p_off: 0.25, merge_gap_s: 0.5, min_len_s: 0.5}
      groups:                        # water_injection 未训练，不引用
        brushing: [long_brush_insert, long_brush_withdraw]
        insert: [long_brush_insert]
        withdraw: [long_brush_withdraw]
        short_brush: [short_brush_cleaning]
        flush: [flush]
      rules:
        - id: clean.short_brush.duration
          type: duration
          group: short_brush
          min_s: 10.0
          min_visible_ratio: 0.6
          message: "短毛刷刷洗约 {duration_s:.0f} s，不足 10 s，请回看确认"
        - id: clean.long_brush.count
          type: count
          group: brushing
          unit: round_trip           # 一次 = 一次完整的插入加拔出
          forward: insert
          backward: withdraw
          min_count: 4
          min_visible_ratio: 0.6
          message: "长毛刷刷洗 {count} 次，少于 4 次，请回看确认"
        - id: clean.brush.order
          type: order
          before: short_brush
          after: brushing
          before_q: 0.9              # 短刷累计证据 90% 的时刻
          after_q: 0.1               # 长刷累计证据 10% 的时刻
          present_s: 2.0
          margin_s: 3.0
          message: "长毛刷刷洗（{at} 起）早于短毛刷刷洗完成，请回看确认"
        - id: clean.flush.missing
          type: presence
          group: flush
          present_s: 5.0
          absent_s: 1.0
          min_visible_ratio: 0.6
          message: "未检测到灌注清洗液（可见时长占比 {visible_ratio:.0%}），请回看确认"
        - id: clean.flush.wait
          type: wait
          after: flush
          until: [short_brush, brushing]
          min_s: 15.0
          min_visible_ratio: 0.8     # 等待区间内的可见率
          message: "灌注清洗液后 {wait_s:.0f} s 即开始刷洗（{at}），不足 15 s，请回看确认"

# ==================== 推理自有参数 ====================
# 注意：跨模块共享参数（raw_fps / inference_fps / ca_maxlen / ca_segment_len）已上浮到
#       app/settings.py 作单一真源，此处不再保留——避免其它模块反向钻进推理配置读共享参数。
batch_size: 4                     # 推理批量大小（推理模块自有）
