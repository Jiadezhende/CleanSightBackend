# 推理服务阶段配置文件（简化版 - 新架构）
# 
# 新架构说明：
# 1. 时序分析逻辑已下沉到每个 InferenceTask 的 analyze_temporal() 方法
# 2. 可视化使用固定渲染器（FixedVisualizer），Task 只需提供 VisualizationData
# 3. 告警评估在 Task 的 evaluate_alarms() 方法中实现
# 4. YAML 配置只需声明 Task 列表和参数，无需配置 temporal_analyzer 和 visualizer
#
# 开发者只需：
# 1. 创建 InferenceTask 子类
# 2. 实现 4 个核心方法（infer, analyze_temporal, prepare_visualization_data, evaluate_alarms）
# 3. 在 YAML 中声明 Task

stages:
  # ==================== LEAK 阶段（泄漏检测） ====================
  LEAK:
    # 模型列表（按顺序执行）
    # 每个 Task 自带时序分析、可视化、告警逻辑
    models:
      - name: bubble_detection
        class: app.services.inference.workflows.bubble.BubbleDetectionTask
        params:
          model_path: ${CLEANSIGHT_MODEL_PATH:./app/data}/bubble-best.pt
          conf_threshold: 0.5
          iou_threshold: 0.45
          enabled: true

      - name: bending_detection
        class: app.services.inference.workflows.bending.EndoscopeBendingDetectionTask
        params:
          model_path: ${CLEANSIGHT_MODEL_PATH:./app/data}/bend-best.pt
          conf_threshold: 0.6
          iou_threshold: 0.45
          enabled: true

    # 以下配置在新架构中已不需要（保留用于向后兼容）
    # temporal_analyzer:
    #   class: app.services.inference.components.DefaultTemporalAnalyzer
    #   config: ...
    # visualizer:
    #   class: app.services.inference.components.DefaultVisualizer
    # alarm_triggers: ...

  # ==================== CLEAN 阶段（清洁检测） ====================
  CLEAN:
    models:
      # 示例：未来添加的清洁质量检测模型
      # - name: quality_detection
      #   class: app.services.models.quality.QualityDetectionTask
      #   params:
      #     model_path: ${QUALITY_MODEL_PATH:./weights/quality.pt}
      #     enabled: true
      #     confidence_threshold: 0.7

# ==================== 全局配置（所有模块共享） ====================
global:
  # 视频处理参数（所有模块共享）
  raw_fps: 30                     # 原始视频帧率（persistence, stream模块会读取）
  inference_fps: 20               # 推理/输出帧率（persistence, client模块会读取）

  # 批处理参数
  batch_size: 4                   # 推理批量大小
  inference_decimation: 2         # 推理降帧率（1=不降帧，2=每2帧推理1次）

  # 队列参数（client模块会读取）
  ca_maxlen: 2700                 # CA队列最大长度（帧数，约90秒@30fps）
  ca_segment_len: 300             # HLS段长度（帧数，约10秒@30fps）

  # 可视化参数（新架构）
  visualization:
    enabled: true                 # 是否启用可视化
    use_fixed_visualizer: false   # 是否使用新的固定渲染器（设为 true 启用）

  # 注意：
  # - persistence和client模块会直接读取这些参数，保证全局一致性
  # - 修改这些参数会影响所有相关模块
