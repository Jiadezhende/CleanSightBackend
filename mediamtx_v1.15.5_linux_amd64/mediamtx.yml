###############################################
# MediaMTX — CleanSightBackend 精简配置
#
# 本项目仅使用 RTSP 协议（127.0.0.1:18004，仅本机），
# 外部访问通过 RTSPProxy TCP 代理网关转发。
# RTMP / HLS / WebRTC / SRT / Playback / API / Metrics / PPROF 均已禁用。
###############################################

# ── 日志 ──────────────────────────────────────
logLevel: info
logDestinations: [stdout]

# ── 网络超时 ──────────────────────────────────
readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 512

# ── 认证（内部模式）──────────────────────────
authMethod: internal
authInternalUsers:
  # 默认：允许任意 IP 推流/拉流（外部访问已由 RTSPProxy 限制）
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:

  # 本机管理接口（当前未启用 API/Metrics/PPROF，保留以备后用）
  - user: any
    pass:
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: api
      - action: metrics
      - action: pprof

# ── 控制 API（关闭）────────────────────────────
api: no

# ── Metrics（关闭）────────────────────────────
metrics: no

# ── PPROF（关闭）──────────────────────────────
pprof: no

# ── Playback（关闭）────────────────────────────
playback: no

# ── RTSP 服务（核心，仅本机 TCP）──────────────
rtsp: yes
# 仅监听本机，外部无法直连；RTSPProxy 代理外部流量到此端口
rtspAddress: 127.0.0.1:18004
# 仅开启 TCP，与 RTSPProxy 的 TCP 转发对齐，排除 UDP/multicast 干扰
rtspTransports: [tcp]
rtspEncryption: "no"

# ── RTMP（关闭）────────────────────────────────
rtmp: no

# ── HLS（关闭）─────────────────────────────────
# 本项目 HLS 由 persistence/hls_worker 自行处理，不依赖 MediaMTX 内置 HLS
hls: no

# ── WebRTC（关闭）──────────────────────────────
webrtc: no

# ── SRT（关闭）─────────────────────────────────
srt: no

###############################################
# 路径默认值（仅保留实际生效的字段）
###############################################
pathDefaults:
  source: publisher
  maxReaders: 0
  overridePublisher: yes

###############################################
# 路径配置
###############################################
paths:
  all_others:
