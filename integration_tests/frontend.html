<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>CleanSight 告警面板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f6fa; color: #333; padding: 24px; }

    h2 { font-size: 1.2em; margin-bottom: 16px; color: #222; }

    .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    input {
      border: 1px solid #ccc; padding: 6px 10px; border-radius: 4px;
      font-size: 0.9em; width: 200px;
    }
    button {
      padding: 6px 16px; border-radius: 4px; border: none;
      cursor: pointer; font-size: 0.9em;
    }
    .btn-connect    { background: #4c84ff; color: #fff; }
    .btn-disconnect { background: #eee; color: #555; }
    button:hover { opacity: 0.85; }

    #connStatus { font-size: 0.85em; color: #888; margin-bottom: 16px; }
    #videoStats { font-size: 0.8em; color: #aaa; margin-bottom: 16px; }

    canvas { display: block; border-radius: 8px; background: #000; max-width: 100%; margin-bottom: 20px; }

    .cards { display: flex; gap: 16px; flex-wrap: wrap; }

    .card {
      background: #fff; border-radius: 8px; padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08); flex: 1; min-width: 220px;
    }
    .card-title { font-size: 0.8em; color: #888; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }

    #stageVal { font-size: 1.8em; font-weight: bold; color: #4c84ff; }

    .det-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 0.9em;
    }
    .det-item:last-child { border-bottom: none; }
    .badge { padding: 2px 10px; border-radius: 12px; font-size: 0.8em; font-weight: bold; }
    .badge-ok    { background: #e6f9ee; color: #27ae60; }
    .badge-alarm { background: #fdecea; color: #e74c3c; }

    .alarm-item { padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 0.88em; }
    .alarm-item:last-child { border-bottom: none; }
    .alarm-header { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
    .level-error { color: #e74c3c; font-weight: bold; }
    .level-warn  { color: #e67e22; font-weight: bold; }
    .alarm-type  { color: #888; font-size: 0.85em; }
    .alarm-msg   { color: #333; }
    .alarm-ts    { color: #bbb; font-size: 0.8em; margin-top: 2px; }
    .empty       { color: #bbb; font-size: 0.88em; }
  </style>
</head>
<body>
  <h2>CleanSight 告警面板</h2>

  <div class="controls">
    <span>Server:</span>
    <input id="server" value="localhost:8000" placeholder="host:port">
    <span>Client ID:</span>
    <input id="clientId" value="" placeholder="client_id (source_ip)">
    <button class="btn-connect" onclick="connect()">连接</button>
    <button class="btn-disconnect" onclick="disconnect()">断开</button>
  </div>

  <div id="connStatus">未连接</div>
  <div id="videoStats"></div>

  <canvas id="canvas" width="640" height="480"></canvas>

  <div class="cards">
    <div class="card" style="max-width:160px;">
      <div class="card-title">当前阶段</div>
      <div id="stageVal">—</div>
    </div>

    <div class="card" style="max-width:260px;">
      <div class="card-title">检测结果</div>
      <div id="detections"><span class="empty">暂无数据</span></div>
    </div>

    <div class="card">
      <div class="card-title">近期告警（最多5条）</div>
      <div id="alarms"><span class="empty">暂无告警</span></div>
    </div>
  </div>

  <script>
    let wsMsg = null, wsVideo = null;
    let frameCount = 0, lastTime = Date.now(), lastCount = 0;

    const params = new URLSearchParams(location.search);
    if (params.get('server'))    document.getElementById('server').value   = params.get('server');
    if (params.get('client_id')) document.getElementById('clientId').value = params.get('client_id');
    if (params.get('client_id') && params.get('server')) connect();

    function connect() {
      disconnect();
      const server   = document.getElementById('server').value.trim();
      const clientId = document.getElementById('clientId').value.trim();
      if (!clientId) { alert('请输入 client_id'); return; }

      // 1. 告警 WebSocket
      wsMsg = new WebSocket(`ws://${server}/task/msg/${encodeURIComponent(clientId)}`);
      wsMsg.onopen  = () => document.getElementById('connStatus').textContent = `已连接 | server: ${server} | client: ${clientId}`;
      wsMsg.onclose = (e) => document.getElementById('connStatus').textContent = `告警断开 (code=${e.code})`;
      wsMsg.onerror = () => document.getElementById('connStatus').textContent = '告警连接错误';
      wsMsg.onmessage = (evt) => renderMsg(JSON.parse(evt.data));

      // 2. 视频 WebSocket
      wsVideo = new WebSocket(`ws://${server}/ai/video?client_id=${encodeURIComponent(clientId)}`);
      wsVideo.onclose = () => document.getElementById('videoStats').textContent = '视频流已断开';
      wsVideo.onerror = () => document.getElementById('videoStats').textContent = '视频流连接错误';
      wsVideo.onmessage = (evt) => {
        if (!evt.data.startsWith('data:image')) return;
        frameCount++;
        const img = new Image();
        img.onload = () => {
          const canvas = document.getElementById('canvas');
          if (canvas.width !== img.naturalWidth || canvas.height !== img.naturalHeight) {
            canvas.width  = img.naturalWidth  || 640;
            canvas.height = img.naturalHeight || 480;
          }
          canvas.getContext('2d').drawImage(img, 0, 0);
        };
        img.src = evt.data;

        const now = Date.now();
        if (now - lastTime >= 1000) {
          const fps = ((frameCount - lastCount) / (now - lastTime) * 1000).toFixed(1);
          document.getElementById('videoStats').textContent = `视频帧数: ${frameCount} | FPS: ${fps}`;
          lastTime = now; lastCount = frameCount;
        }
      };
    }

    function disconnect() {
      if (wsMsg)   { wsMsg.close();   wsMsg   = null; }
      if (wsVideo) { wsVideo.close(); wsVideo = null; }
      frameCount = 0; lastCount = 0;
    }

    function renderMsg(data) {
      if (data.error) {
        document.getElementById('stageVal').textContent = '—';
        document.getElementById('detections').innerHTML = `<span class="empty">${data.error}</span>`;
        document.getElementById('alarms').innerHTML = '';
        return;
      }

      document.getElementById('stageVal').textContent = data.stage ?? '—';

      const dets = data.detections || {};
      const detEl = document.getElementById('detections');
      if (Object.keys(dets).length === 0) {
        detEl.innerHTML = '<span class="empty">暂无数据</span>';
      } else {
        detEl.innerHTML = Object.entries(dets).map(([k, v]) =>
          `<div class="det-item">
            <span>${k}</span>
            <span class="badge ${v ? 'badge-alarm' : 'badge-ok'}">${v ? '异常' : '正常'}</span>
          </div>`
        ).join('');
      }

      const alarms = data.recent_alarms ?? [];
      const alarmEl = document.getElementById('alarms');
      if (alarms.length === 0) {
        alarmEl.innerHTML = '<span class="empty">暂无告警</span>';
      } else {
        alarmEl.innerHTML = alarms.slice().reverse().map(a => {
          const ts = a.timestamp ? new Date(a.timestamp * 1000).toLocaleTimeString() : '—';
          const lvlCls = a.alarm_level === 'ERROR' ? 'level-error' : 'level-warn';
          const metricBadge = a.metric ? `<span style="background:#eef2ff;color:#4c84ff;border-radius:3px;padding:1px 6px;font-size:0.8em;margin-left:4px">${a.metric}</span>` : '';
          const modeBadge = a.mode ? `<span style="color:#bbb;font-size:0.8em;margin-left:4px">${a.mode}</span>` : '';
          const countBadge = a.count > 1 ? `<span style="color:#aaa;font-size:0.8em"> ×${a.count}</span>` : '';
          return `<div class="alarm-item">
            <div class="alarm-header">
              <span class="${lvlCls}">${a.alarm_level ?? '?'}</span>
              <span class="alarm-type">${a.alarm_type ?? ''}</span>
              ${metricBadge}${modeBadge}
            </div>
            <div class="alarm-msg">${a.alarm_message ?? ''}${countBadge}</div>
            <div class="alarm-ts">${ts}</div>
          </div>`;
        }).join('');
      }
    }
  </script>
</body>
</html>
