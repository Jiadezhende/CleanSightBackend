[gateway]
; MediaMTX 可执行文件路径（相对于项目根目录，或绝对路径）
; 留空则不管理 MediaMTX 进程（纯代理模式，MediaMTX 由外部负责启动）
; Windows:
mediamtx_bin    = mediamtx_v1.15.4/mediamtx.exe
; Linux（按需取消注释）:
; mediamtx_bin = mediamtx_v1.15.5_linux_amd64/mediamtx

; MediaMTX 配置文件路径（相对于项目根目录，或绝对路径）
; 该 yml 中 rtspAddress 已配置为 127.0.0.1:18004（仅本地监听）
mediamtx_config = mediamtx_v1.15.4/mediamtx.yml

; 对外暴露的 RTSP 端口（客户端连接此端口）
listen_port  = 8004

; MediaMTX 实际监听端口（内部，需与 mediamtx.yml 的 rtspAddress 端口一致）
target_port  = 18004

; IP 白名单（逗号分隔），留空表示允许所有来源 IP
allowed_ips  =

; 速率限制：每 rate_window 秒内，单个 IP 最多建立 rate_limit 次连接
rate_limit   = 30
rate_window  = 60

; IP 封禁时长（秒），触发白名单拦截或速率超限后生效
ban_duration = 3600
